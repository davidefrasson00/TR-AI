# =====================================================================
# TR-AI — Strategy Configuration: WAM-FVG
# Wyckoff Accumulation-Manipulation-Distribution + Fair Value Gap
# =====================================================================

strategy:
  id: wam_fvg
  name: "Wyckoff AM-Distribution + FVG Strategy"
  enabled: false # Di default sempre disattivata
  mode: paper

  instruments:
    US500:
      symbol_alias: ["SPX500", "US500Cash", "ES"]
      template: us_open
      risk_bucket: us_indices
      point_value: 1.0 # Verrà aggiornato dinamicamente dal broker
      tick_size: 0.1
    USTEC:
      symbol_alias: ["NAS100", "US100Cash", "NQ"]
      template: us_open
      risk_bucket: us_indices
      point_value: 1.0
      tick_size: 0.25
    DE40:
      symbol_alias: ["GER40", "DAX40", "FDAX"]
      template: [frankfurt_open, us_open]
      risk_bucket: eu_indices
      point_value: 1.0
      tick_size: 0.5

  timeframes:
    range: M15
    structure: M5
    entry_refine: M1
    htf_bias: [H1, H4]

  sessions:
    us_open:
      tz: America/New_York
      range_window: {start: "06:30", end: "09:30"}
      manipulation_window: {start: "09:30", end: "11:00"}
      entry_deadline: "11:30"
    frankfurt_open:
      tz: Europe/Berlin
      range_window: {start: "07:00", end: "09:00"}
      manipulation_window: {start: "09:00", end: "10:30"}
      entry_deadline: "11:00"

  range:
    atr_period: 14
    min_height_atr: 0.5
    max_height_atr: 2.5
    min_bars_inside_pct: 70
    max_efficiency_ratio: 0.35
    equal_level_tolerance_atr: 0.05

  sweep:
    min_depth_frac: 0.03
    max_depth_frac: 0.50
    max_closes_beyond: 2
    max_bars_to_reentry: 12

  displacement:
    min_body_atr: 1.0
    close_in_extreme_pct: 30
    require_mss: true
    require_fvg: true

  fvg:
    timeframe: M5
    min_size_atr: 0.15
    max_size_atr: 2.0
    selection: largest_overlapping_ote
    max_fill_pct_allowed: 50
    invalidate_on_inversion: true

  fib:
    ote_low: 0.62
    ote_high: 0.79
    levels: [0.5, 0.618, 0.705, 0.786]

  entry:
    mode: confluence_fvg_ote
    order_type: limit
    confirmation: none
    pending_expiry_bars: 12

  stop_loss:
    reference: sweep_extreme
    buffer_ticks: 2
    spread_multiplier: 1.5
    max_distance_atr: 1.5

  take_profit:
    tp1:
      reference: opposite_range_extreme
      offset_ticks: 2
    tp2:
      reference: next_liquidity
    partial_pct_at_tp1: 50
    move_to_be_after_tp1: true
    min_rr: 2.0

  filters:
    htf_bias:
      role: score
      mode: aligned_preferred
    vwap:
      enabled: true
      anchor: session_start
      bands_sigma: [1, 2]
      role: score
    volume_profile:
      enabled: true
      source: tick
      value_area_pct: 70
      role: score
    news:
      enabled: true
      block_before_min: 15
      block_after_min: 5
      allow_post_news_sweep: false
    spread:
      max_vs_avg: 2.0

  limits:
    max_trades_per_window_per_instrument: 1
    max_attempts: 2
    one_position_per_risk_bucket: true

  scoring:
    min_score: 60
